<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARICE LABYRINTH v0.2</title><style>*{box-sizing:border-box}body{background:#11151d;color:#e7edf5;font:15px system-ui;margin:0;padding:16px}main{max-width:620px;margin:auto}h1{font-size:25px;letter-spacing:3px;margin:8px 0}button,select{background:#27364a;color:white;border:1px solid #52657e;border-radius:7px;padding:10px;margin:3px;touch-action:manipulation}button:disabled{opacity:.35}#board{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;aspect-ratio:1;background:#344052;padding:3px;border-radius:8px}.cell{margin:0;padding:0;border:0;border-radius:2px;background:#b9c9d5;color:#111;min-width:0;font-size:clamp(9px,2.8vw,16px);font-weight:bold}.core{background:#b92e50!important;color:white!important}.hole{background:#080a10;color:#b9a3ff}.a{background:#5bb8ff}.b{background:#77dfb0}.guard{box-shadow:inset 0 0 0 3px #e6b95c}.bomb{box-shadow:inset 0 0 0 3px #f27950}.panel{background:#1c2532;padding:12px;border-radius:8px;margin:10px 0}#log{height:85px;overflow:auto;font-size:12px;color:#aab9cc}#status{font-weight:bold;color:#9fd9ff}small{color:#aab9cc}label{display:block;margin:8px 0}</style><main><h1>ARICE LABYRINTH</h1><small>無意味研究機構 / PROTOTYPE 0.2</small><section id="setup" class="panel"><label>陣営 <select id="side"><option value="0">修復側（味方CPUあり）</option><option value="1">侵食側</option></select></label><div id="loadout"></div><button id="start">ゲーム開始</button><p>修復側はコアを破壊、侵食側は修復者を全滅させる。装備を2種類選択。</p></section><section id="game" hidden><div class="panel"><div id="status"></div><div id="clock"></div><small id="stats"></small></div><div id="board"></div><div class="panel" id="actions"></div><div id="hint"></div><details class="panel"><summary>ルール・操作</summary>黄色枠のマスをタップして行動。赤い核を破壊すれば修復側勝利。黒い穴の数字はHP。侵食側の行動終了時に自動侵食1マス、穴の上の修復者はHP1減少。連鎖修復でコアにつながる穴を5マス以上消すと追加ダメージ。爆弾の数字は残り巡数。</details><div class="panel" id="log"></div><button onclick="location.reload()">タイトルへ</button></section></main><script>
const $=x=>document.getElementById(x), N=144, names=[['修復剤','修復爆弾','侵食防止板','連鎖修復装置','仮設足場','救助ロープ'],['急速侵食','硬化','分裂','飛び火','装置吸収','大侵食']], desc=[['隣接穴に2ダメージ','2巡後に周囲へ3ダメージ','床を3巡保護','隣接する穴の集団に2ダメージ','穴1マスを一時的に床に','倒れた仲間を復帰'],['指定穴から最大3マス拡大','穴のHPを2増加','穴を床に戻して分断','離れた床に穴を作る','修復爆弾を消す','指定穴周囲を最大5マス侵食']];let core=0,coreHP=20,life=[5,5],side=0, hp=[],guard=[],bomb=[],pos=[],alive=[],kits=[],stock=[],skills=[],energy=0,turn=0,round=1,mode=-1,over=false,busy=false,bank=[120,120,120],by=10,stamp=0,timer;const adj=i=>[i-12,i+12,i%12?i-1:-1,i%12<11?i+1:-1].filter(j=>j>=0&&j<N),dist=(a,b)=>Math.abs(a%12-b%12)+Math.abs((a/12|0)-(b/12|0)),range=(i,r)=>Array.from({length:N},(_,j)=>j).filter(j=>dist(i,j)<=r),holes=()=>hp.map((v,i)=>v?i:-1).filter(i=>i>=0),occupied=i=>pos.some((p,k)=>alive[k]&&p===i),human=()=>side?turn===2:turn===0,log=s=>{$('log').innerHTML=s+'<br>'+$('log').innerHTML};function setup(){side=+$('side').value;$('loadout').innerHTML=names[side].map((n,i)=>`<label><input type="checkbox" value="${i}" ${i<2?'checked':''}> ${n} — ${desc[side][i]}</label>`).join('');$('loadout').onchange=e=>{if(document.querySelectorAll('#loadout input:checked').length>2)e.target.checked=false}}$('side').onchange=setup;setup();
$('start').onclick=()=>{let pick=[...document.querySelectorAll('#loadout input:checked')].map(x=>+x.value);if(pick.length!==2)return alert('2種類選択してください');hp=Array(N).fill(0);guard=Array(N).fill(0);const rand=a=>a[Math.floor(Math.random()*a.length)];core=rand(range(65,2).filter(i=>i%12>=4&&i%12<=7));hp[core]=3;for(let n=0;n<11;n++){let f=frontier().filter(i=>i%12>=3&&i%12<=8);if(f.length)hp[rand(f)]=1+Math.floor(Math.random()*3)}pos=[rand(Array.from({length:N},(_,i)=>i).filter(i=>i%12<2&&dist(i,core)>=5)),rand(Array.from({length:N},(_,i)=>i).filter(i=>i%12>9&&dist(i,core)>=5))];coreHP=20;life=[5,5];alive=[true,true];kits=[side?[0,3]:pick,[1,3]];stock=kits.map(k=>k.map(()=>4));skills=side?pick:[0,5];energy=4;$('setup').hidden=true;$('game').hidden=false;timer=setInterval(tick,150);begin()};
function component(i){let seen=new Set([i]),q=[i];while(q.length)for(let j of adj(q.shift()))if(hp[j]&&!seen.has(j)){seen.add(j);q.push(j)}return [...seen]}
function damage(i,n){if(i===core){coreHP=Math.max(0,coreHP-n);return}hp[i]=Math.max(0,hp[i]-n)}function repairMany(c,n){let before=c.filter(i=>i!==core&&hp[i]);let linked=c.includes(core)||before.some(i=>component(i).includes(core));c.forEach(i=>damage(i,n));let count=before.filter(i=>!hp[i]).length;let bonus=count>=20?8:count>=15?5:count>=10?3:count>=5?1:0;if(linked&&bonus){coreHP=Math.max(0,coreHP-bonus);log(`連鎖 ${count}マス！ コアに追加${bonus}ダメージ`)}return count}function grow(i){if(!hp[i]&&!guard[i]){hp[i]=1;return true}return false}function frontier(){return [...new Set(holes().flatMap(adj))].filter(i=>!hp[i]&&!guard[i])}function finish(s){over=true;clearInterval(timer);$('status').textContent=s;log(s);render()}function check(){if(coreHP<=0){finish('修復側 WIN — コア破壊');return true}if(!alive.some(Boolean)){finish('侵食側 WIN');return true}return false}function hurt(){for(let k=0;k<2;k++)if(alive[k]&&hp[pos[k]]){life[k]=Math.max(0,life[k]-1);log('修復者'+(k+1)+'：侵食ダメージ1');if(!life[k]){alive[k]=false;log('修復者'+(k+1)+'が行動不能！')}}}
function valid(i,m=mode){if(turn<2){let p=pos[turn];if(m===-1)return adj(p).includes(i)&&i!==core&&!occupied(i);if(!stock[turn][m])return false;let k=kits[turn][m];if(k===5)return !alive[1-turn]&&dist(p,i)<=2&&!hp[i]&&!occupied(i);if(dist(p,i)>2)return false;return [0,3,4].includes(k)?!!hp[i]&&(k!==4||i!==core):!hp[i]}if(m===-1)return frontier().includes(i);if(energy<2)return false;let k=skills[m];return k===3?!hp[i]&&!guard[i]:k===4?bomb.some(b=>b.i===i):!!hp[i]&&(![1,2].includes(k)||i!==core)}
function act(i){if(over||!valid(i))return;if(turn<2){if(mode===-1)pos[turn]=i;else{let k=kits[turn][mode];stock[turn][mode]--;if(k===0)damage(i,2);if(k===1)bomb.push({i,t:2});if(k===2)guard[i]=3;if(k===3){let c=component(i);let count=repairMany(c,2);log('連鎖修復 '+count+'マス！')}if(k===4){hp[i]=0;guard[i]=2}if(k===5){alive[1-turn]=true;life[1-turn]=2;pos[1-turn]=i}log('修復者'+(turn+1)+'：'+names[0][k])}}else{if(mode===-1)grow(i);else{let k=skills[mode];energy-=2;if(k===0||k===5){let candidates=[...new Set(component(i).flatMap(adj))].filter(j=>!hp[j]&&!guard[j]).sort((a,b)=>dist(a,i)-dist(b,i));candidates.slice(0,k===0?3:5).forEach(grow)}if(k===1)hp[i]+=2;if(k===2)hp[i]=0;if(k===3)grow(i);if(k===4)bomb=bomb.filter(b=>b.i!==i);log('侵食：'+names[1][k])}}end()}
function end(){if(over||busy)return;busy=true;bank[turn]=Math.max(0,bank[turn]-(performance.now()-stamp)/1000);if(check())return;if(turn===2){let f=frontier();if(f.length){grow(f[Math.floor(Math.random()*f.length)]);log("自動侵食：1マス")}hurt();round++;energy=Math.min(8,energy+1);guard=guard.map(x=>Math.max(0,x-1));bomb.forEach(b=>{if(--b.t===0){repairMany(range(b.i,2),3);log('修復爆弾発動！')}});bomb=bomb.filter(b=>b.t>0);if(check())return}do{turn=(turn+1)%3}while(turn<2&&!alive[turn]);begin()}
function begin(){busy=false;mode=-1;stamp=performance.now();render();if(!human())setTimeout(cpu,350)}function tick(){if(over)return;let elapsed=(performance.now()-stamp)/1000,left=Math.max(0,bank[turn]-elapsed);$('clock').textContent='持ち時間 '+Math.ceil(left)+'秒 / 秒読み '+Math.ceil(Math.max(0,10-Math.max(0,elapsed-bank[turn])))+'秒';if(human()&&elapsed>bank[turn]+10)end()}
function cpu(){if(over||human()||busy)return;let best=null;for(let m=-1;m<2;m++)for(let i=0;i<N;i++)if(valid(i,m)){let score=0;if(turn<2){let k=m<0?-1:kits[turn][m];if(k===3)score=component(i).reduce((s,j)=>s+Math.min(hp[j],2),0)*4+(component(i).includes(core)?10:0);if(k===0)score=i===core?22:7;if(k===1)score=range(i,2).filter(j=>hp[j]).length*2;if(k===5)score=25;if(k===4)score=3;if(k===2)score=1;if(k===-1)score=4-dist(i,core)*.5-(hp[i]?4:0)-frontier().includes(i)*2}else{let k=m<0?-1:skills[m];score=8-Math.min(...pos.filter((p,j)=>alive[j]).map(p=>dist(i,p)));if(occupied(i)&&[3,-1].includes(k))score+=50;if(k===0||k===5){score+=3;let f=component(i).flatMap(adj);if(f.some(occupied))score+=20}if(k===1)score=2;if(k===2)score=-3;if(k===4)score=12}score+=Math.random()*.4;if(!best||score>best.score)best={i,m,score}}if(best){mode=best.m;act(best.i)}else end()}
function render(){$('stats').textContent=`第${round}巡 / コアHP ${coreHP}/20 / 修復者HP ${life.join("・")} / 穴 ${holes().length}マス / 侵食SP ${energy} / 修復者 ${alive.filter(Boolean).length}人`;if(!over)$('status').textContent=(turn===2?'侵食側':'修復者 '+(turn+1))+(human()?' — あなたの番':' — CPU');$('board').innerHTML='';for(let i=0;i<N;i++){let b=document.createElement('button');b.className='cell'+(hp[i]?' hole':'')+(guard[i]?' guard':'')+(bomb.some(x=>x.i===i)?' bomb':'');if(i===core)b.className+=' core';let k=pos.findIndex((p,j)=>p===i&&alive[j]);if(k>=0)b.className+=' '+(k?'b':'a');b.textContent=k>=0?'●'+(k+1):i===core?'核':bomb.some(x=>x.i===i)?'◉'+bomb.find(x=>x.i===i).t:hp[i]||'';if(!over&&human()&&valid(i))b.style.outline='1px solid #f3cc6a';b.onclick=()=>{if(human()&&!busy)act(i)};$('board').append(b)}$('actions').innerHTML='';if(over)return;let opts=turn===2?skills:kits[turn];[-1,0,1].forEach(m=>{let b=document.createElement('button');b.textContent=m<0?(turn===2?'通常侵食':'移動'):names[turn===2?1:0][opts[m]]+(turn===2?' (2SP)':' ×'+stock[turn][m]);b.disabled=!human()||(m>=0&&(turn===2?energy<2:!stock[turn][m]));if(mode===m)b.style.borderColor='#ffce65';b.onclick=()=>{mode=m;render()};$('actions').append(b)});let pass=document.createElement('button');pass.textContent='パス';pass.disabled=!human();pass.onclick=end;$('actions').append(pass);$('hint').textContent=human()?(mode<0?'黄色の枠から対象マスを選択':desc[turn===2?1:0][opts[mode]]+'：黄色の枠から選択'):'CPU行動中…'}
</script></html>
